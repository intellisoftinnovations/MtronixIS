{% load mtx %}
{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}
  <a href="{% url_replace page=page.previous_page_number %}" class="page-link">{% icon "chevron-left" 16 %}</a>
  {% endif %}
  <span class="page-info">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
  <a href="{% url_replace page=page.next_page_number %}" class="page-link">{% icon "chevron-right" 16 %}</a>
  {% endif %}
</nav>
{% endif %}
